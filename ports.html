<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ports Nintendo Switch</title>
<style>
:root{
  color-scheme:dark;
  --bg:#050505;--panel:#101419;--panel2:#0b0f13;--text:#f5f7fa;--muted:#9ba7b5;
  --line:#27313d;--cyan:#22c7f2;--red:#ff3b4d;--ok:#58e28a;--fan:#ffca64;--exp:#ff7b92;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:linear-gradient(90deg,var(--cyan) 0 42px,var(--bg) 42px calc(100% - 42px),var(--red) calc(100% - 42px) 100%);
  background-attachment:fixed;
}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-bottom:1px solid #d7dde5;color:#111}
header::before,header::after{content:"";position:absolute;top:0;bottom:0;width:42px;pointer-events:none}
header::before{left:0;background:var(--cyan)}header::after{right:0;background:var(--red)}
.wrap,main,footer{max-width:1560px;margin:auto;padding-left:64px;padding-right:64px}
.wrap{padding-top:18px;padding-bottom:15px}
h1{margin:0;text-align:center;font-size:clamp(26px,3vw,38px);letter-spacing:-.035em;color:#111}
.subtitle{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.pill{appearance:none;border:0;color:#071018;padding:7px 11px;border-radius:999px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:.15s;box-shadow:0 2px 7px rgba(0,0,0,.12)}
.pill:nth-child(odd){background:var(--cyan)}
.pill:nth-child(even){background:var(--red);color:#fff}
.pill:hover{transform:translateY(-1px) scale(1.02);filter:brightness(1.06)}
.pill.active{box-shadow:0 0 0 3px #111,0 2px 8px rgba(0,0,0,.2)}
main{padding-top:20px;padding-bottom:60px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:18px;color:#c9d2dc;font-size:13px;line-height:1.55}
.note strong{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:#fff;color:#111;border:1px solid #d9dee5;border-radius:16px;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.card:hover{transform:translateY(-2px);border-color:#aeb7c2;box-shadow:0 12px 30px rgba(0,0,0,.24)}
.shot{position:relative;aspect-ratio:16/9;background:#0d1218;overflow:hidden;display:block}
.shot>.gameplay{width:100%;height:100%;object-fit:cover;display:block}
.cover{
  position:absolute;right:10px;top:10px;width:25%;max-width:82px;aspect-ratio:2/3;object-fit:cover;
  border-radius:5px;border:1px solid rgba(255,255,255,.5);background:#181818;
  box-shadow:-9px 11px 16px rgba(0,0,0,.55),0 0 0 2px rgba(0,0,0,.25);
  transform:perspective(600px) rotateY(-10deg) rotateZ(1deg);transform-origin:right center;z-index:3;
}
.label{position:absolute;top:8px;left:8px;max-width:62%;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.14);z-index:4}
.ok{color:var(--ok)}.fan{color:var(--fan)}.exp{color:var(--exp)}
.body{padding:13px 14px 14px;background:#fff;color:#111}.name{font-size:16px;font-weight:800;line-height:1.2;margin-bottom:7px;color:#111}.meta{font-size:12px;color:#5e6773}
.intro{font-size:12.5px;line-height:1.48;color:#30363d;margin-top:9px;min-height:55px}.intro.loading{color:#7a8490;font-style:italic}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.actions a,.actions button{appearance:none;text-decoration:none;text-align:center;border:0;border-radius:9px;padding:9px 7px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;color:#071018;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.actions>*:nth-child(odd){background:var(--cyan)}
.actions>*:nth-child(even){background:var(--red);color:#fff}
.actions a:hover,.actions button:hover{filter:brightness(1.08);transform:translateY(-1px)}

.empty{display:none;color:var(--muted);text-align:center;padding:50px}
footer{padding-top:0;padding-bottom:35px;color:#7f8b99;font-size:12px;line-height:1.5}

/* Zoom */
.zoom-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.96);padding:24px}
.zoom-modal.open{display:flex}.zoom-stage{position:relative;width:min(96vw,1500px);height:min(92vh,950px);display:flex;align-items:center;justify-content:center}
.zoom-gameplay{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
.zoom-cover{position:absolute;right:2.5%;top:2.5%;width:min(19vw,240px);max-height:48%;object-fit:contain;border-radius:8px;border:1px solid rgba(255,255,255,.55);box-shadow:-14px 18px 32px rgba(0,0,0,.7);transform:perspective(900px) rotateY(-9deg)}
.zoom-title{position:absolute;left:20px;bottom:16px;max-width:70%;padding:8px 11px;border-radius:9px;background:rgba(0,0,0,.72);font-weight:800;font-size:14px}
.zoom-close{position:absolute;right:16px;top:16px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.72);color:#fff;font-size:22px;cursor:pointer}
body.modal-open{overflow:hidden}

@media(max-width:650px){
 body{background:linear-gradient(90deg,var(--cyan) 0 12px,var(--bg) 12px calc(100% - 12px),var(--red) calc(100% - 12px) 100%);background-attachment:fixed}
 header::before,header::after{width:12px}.wrap,main,footer{padding-left:22px;padding-right:22px}
 .grid{grid-template-columns:1fr 1fr;gap:9px}.body{padding:10px}.name{font-size:13px}.meta,.intro{font-size:11px}.intro{min-height:50px}
 .actions{grid-template-columns:1fr}.cover{width:28%;right:7px;top:7px}.label{max-width:66%}.zoom-modal{padding:10px}.zoom-cover{width:28vw;right:3%;top:3%}
}
@media(max-width:430px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.intro{min-height:auto}}

.meta{display:flex;flex-wrap:wrap;gap:0;align-items:center}
header .wrap{position:relative;z-index:1}

</style>
</head>
<body>
<header><div class="wrap">
  <h1>Ports Nintendo Switch</h1>
  <div class="stats" id="stats" aria-label="Filtros por plataforma"></div>
</div></header>

<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">No hay juegos para ese filtro.</div>
</main>
<footer>La página organiza referencias visuales y enlaces públicos. No contiene juegos ni archivos comerciales.</footer>

<div class="zoom-modal" id="zoomModal" role="dialog" aria-modal="true" aria-label="Vista ampliada">
  <button class="zoom-close" id="zoomClose" aria-label="Cerrar">×</button>
  <div class="zoom-stage">
    <img class="zoom-gameplay" id="zoomGameplay" alt="Captura ampliada">
    <img class="zoom-cover" id="zoomCover" alt="Portada del juego">
    <div class="zoom-title" id="zoomTitle"></div>
  </div>
</div>

function hasForeignScript(text){return /[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/.test(String(text||''))}
function sentenceList(text){return String(text||'').replace(/\s+/g,' ').trim().match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[]}
function storyIntro(text){
  text=String(text||'').replace(/\s+/g,' ').trim();
  if(!text||hasForeignScript(text))return '';
  const sentences=sentenceList(text);
  const useful=/jugador|protagonista|historia|trama|controla|encarna|debe|objetivo|aventura|explora|combate|enfrenta|rescatar|sobreviv|constru|gestiona|carrera|rompecabezas|plataformas|estrategia|rol|mundo abierto|disparos|misiones|viaja|recorre|lucha/i;
  const boiler=/desarrollad|publicad|distribuid|lanzad|estrenad|versión|plataforma|compañía|empresa|director|productor|compositor|fecha de lanzamiento/i;
  let chosen=sentences.filter(s=>useful.test(s)||!boiler.test(s));
  if(!chosen.length)chosen=sentences;
  let out=chosen.slice(0,3).join(' ').trim();
  if(out.length>430)out=out.slice(0,427).replace(/\s+\S*$/,'')+'…';
  return out;
}

async function wikiByTitle(title){
  const api=`https://es.wikipedia.org/w/api.php?action=query&prop=extracts%7Cinfo&inprop=url&exintro=1&explaintext=1&exsentences=6&redirects=1&origin=*&format=json&titles=${encodeURIComponent(title)}`;
  const r=await fetch(api,{mode:'cors'});if(!r.ok)throw new Error('wiki');
  const data=await r.json(),pages=data?.query?.pages?Object.values(data.query.pages):[];
  const p=pages.find(x=>!x.missing&&x.extract);
  if(!p)return null;
  const intro=storyIntro(p.extract||'');
  return intro?{intro,url:p.fullurl||wikiSearchUrl(title)}:null;
}
async function wikiSearch(name){
  const api=`https://es.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent('"'+name+'" videojuego')}&gsrlimit=4&prop=extracts%7Cinfo&inprop=url&exintro=1&explaintext=1&exsentences=6&origin=*&format=json`;
  const r=await fetch(api,{mode:'cors'});if(!r.ok)throw new Error('wiki');
  const data=await r.json(),pages=data?.query?.pages?Object.values(data.query.pages):[];
  for(const p of pages){
    const intro=storyIntro(p.extract||'');
    if(intro)return {intro,url:p.fullurl||wikiSearchUrl(name)};
  }
  return null;
}

const counts={};games.forEach(g=>counts[g.category]=(counts[g.category]||0)+1);
const cats=Object.keys(counts).sort((a,b)=>a.localeCompare(b,'es'));
stats.innerHTML=`<button class="pill active" data-cat="">Todos: ${games.length}</button>`+cats.map(c=>`<button class="pill" data-cat="${esc(c)}">${esc(c)}: ${counts[c]}</button>`).join('');

function cardHtml(g,i){
  return `<article class="card" data-i="${i}" data-cat="${esc(g.category)}">
    <div class="shot">
      <img class="gameplay" id="img-${i}" src="${esc(g.images[0])}" loading="lazy" referrerpolicy="no-referrer" alt="Gameplay de ${esc(g.name)}" onerror="gameplayError(${i})">
      <img class="cover" id="cover-${i}" src="${esc(coverUrl(g.name,0))}" loading="lazy" referrerpolicy="no-referrer" alt="Portada de ${esc(g.name)}" data-cover-variant="0" onerror="coverError(${i})">
      <span class="label ${cls(g.tag)}">${esc(g.tag)}</span>
    </div>
    <div class="body">
      <div class="name">${esc(g.name)}</div>
      <div class="meta">${esc(g.category)} · FW 21+ / activo${g.size?` · Tamaño: ${esc(g.size)}`:''}</div>
      <div class="intro loading" id="intro-${i}">${manualSummaries[g.name]?esc(manualSummaries[g.name]):'Buscando resumen en español…'}</div>
      <div class="actions">
        <button type="button" onclick="openZoom(${i})">Zoom</button>
        <a href="${esc(g.youtube)}" target="_blank" rel="noopener">YouTube gameplay</a>
        <a class="screens" href="${esc(g.bing)}" target="_blank" rel="noopener">Ver más screenshots</a>
        <a class="wiki" id="wiki-${i}" href="${esc(wikiSearchUrl(g.name))}" target="_blank" rel="noopener">Wiki</a>
      </div>
    </div>
  </article>`;
}
grid.innerHTML=games.map(cardHtml).join('');

const gameplayPos=new Array(games.length).fill(0);
window.gameplayError=function(i){
  gameplayPos[i]++;
  const img=document.getElementById('img-'+i),g=games[i];
  if(gameplayPos[i]<g.images.length) img.src=g.images[gameplayPos[i]];
  else img.removeAttribute('onerror');
};
window.coverError=function(i){
  const img=document.getElementById('cover-'+i);
  let v=Number(img.dataset.coverVariant||0)+1;
  if(v<3){img.dataset.coverVariant=v;img.src=coverUrl(games[i].name,v)}else{img.style.display='none';img.removeAttribute('onerror')}
};

function applyCategory(category){
  activeCategory=category;
  let visible=0;
  document.querySelectorAll('.card').forEach(card=>{
    const show=!category||card.dataset.cat===category;
    card.style.display=show?'':'none';if(show)visible++;
  });
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active',p.dataset.cat===category));
  empty.style.display=visible?'none':'block';
  window.scrollTo({top:0,behavior:'smooth'});
}
stats.addEventListener('click',e=>{const b=e.target.closest('.pill');if(b)applyCategory(b.dataset.cat||'')});

window.openZoom=function(i){
  const g=games[i],img=document.getElementById('img-'+i),cover=document.getElementById('cover-'+i);
  zoomGameplay.src=img.currentSrc||img.src;
  zoomCover.src=(cover.style.display==='none')?coverUrl(g.name,1):(cover.currentSrc||cover.src);
  zoomCover.style.display='block';
  zoomTitle.textContent=g.name;
  zoomModal.classList.add('open');document.body.classList.add('modal-open');
};
function closeZoom(){zoomModal.classList.remove('open');document.body.classList.remove('modal-open');zoomGameplay.removeAttribute('src');zoomCover.removeAttribute('src')}
document.getElementById('zoomClose').addEventListener('click',closeZoom);
zoomModal.addEventListener('click',e=>{if(e.target===zoomModal)closeZoom()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&zoomModal.classList.contains('open'))closeZoom()});

const wikiCacheKey='switchports-wiki-meta-v3-es';
let wikiCache={};try{wikiCache=JSON.parse(localStorage.getItem(wikiCacheKey)||'{}')}catch(e){}
async function loadWiki(i){
  const g=games[i],intro=document.getElementById('intro-'+i),wiki=document.getElementById('wiki-'+i);
  const key=g.name;
  if(manualSummaries[key]){
    intro.textContent=manualSummaries[key];intro.classList.remove('loading');
  }
  if(wikiCache[key]){
    if(!manualSummaries[key])intro.textContent=wikiCache[key].intro||'';
    intro.classList.remove('loading');wiki.href=wikiCache[key].url||wikiSearchUrl(g.name);if(!intro.textContent)intro.style.display='none';return;
  }
  let meta=null;
  try{meta=await wikiByTitle(wikiAliases[g.name]||g.name)}catch(e){}
  if(!meta||!meta.intro){try{meta=await wikiSearch(g.name)}catch(e){}}
  if(meta&&meta.intro){
    if(!manualSummaries[key])intro.textContent=meta.intro;
    wiki.href=meta.url;
    wikiCache[key]=meta;try{localStorage.setItem(wikiCacheKey,JSON.stringify(wikiCache))}catch(e){}
  }else{
    wiki.href=wikiSearchUrl(g.name);
    if(!manualSummaries[key])intro.textContent='';
  }
  intro.classList.remove('loading');
  if(!intro.textContent.trim())intro.style.display='none';
}
const wikiObserver=new IntersectionObserver(entries=>{
  for(const e of entries)if(e.isIntersecting){const i=Number(e.target.dataset.i);loadWiki(i);wikiObserver.unobserve(e.target)}
},{rootMargin:'450px 0px'});
document.querySelectorAll('.card').forEach(c=>wikiObserver.observe(c));
</script>
</body>
</html>

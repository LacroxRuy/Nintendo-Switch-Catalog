<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juegos Nintendo Switch</title>
<style>
:root{--bg:#050505;--cyan:#22c7f2;--red:#ff3b4d;--line:#d9dee5;--muted:#5f6873}*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(90deg,var(--cyan) 0 42px,var(--bg) 42px calc(100% - 42px),var(--red) calc(100% - 42px) 100%);background-attachment:fixed;color:#fff}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);border-bottom:1px solid #d7dde5;color:#111;backdrop-filter:blur(14px)}
header:before,header:after{content:"";position:absolute;top:0;bottom:0;width:42px}header:before{left:0;background:var(--cyan)}header:after{right:0;background:var(--red)}
.wrap,main{max-width:1560px;margin:auto;padding-left:64px;padding-right:64px}.wrap{padding-top:18px;padding-bottom:15px}h1{margin:0;text-align:center;font-size:clamp(26px,3vw,38px);letter-spacing:-.035em;color:#111}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}.pill{appearance:none;border:0;padding:7px 11px;border-radius:999px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.12);transition:.15s}.pill:nth-child(odd){background:var(--cyan);color:#071018}.pill:nth-child(even){background:var(--red);color:#fff}.pill:hover{transform:translateY(-1px) scale(1.02)}.pill.active{box-shadow:0 0 0 3px #111,0 2px 8px rgba(0,0,0,.2)}
main{padding-top:20px;padding-bottom:60px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.card{background:#fff;color:#111;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.24)}
.shot{position:relative;aspect-ratio:16/9;background:#0d1218;overflow:hidden}.gameplay{width:100%;height:100%;object-fit:cover;display:block}.cover{position:absolute;right:10px;top:10px;width:25%;max-width:82px;aspect-ratio:2/3;object-fit:cover;border-radius:5px;border:1px solid rgba(255,255,255,.7);background:#181818;box-shadow:-9px 11px 16px rgba(0,0,0,.55),0 0 0 2px rgba(0,0,0,.2);transform:perspective(600px) rotateY(-10deg) rotateZ(1deg);z-index:3}.label{position:absolute;top:8px;left:8px;max-width:62%;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800;background:rgba(0,0,0,.78);color:#fff;z-index:4}
.body{padding:13px 14px 14px}.name{font-size:16px;font-weight:800;line-height:1.2;margin-bottom:7px}.meta{font-size:12px;color:var(--muted)}.intro{font-size:12.5px;line-height:1.48;color:#30363d;margin-top:9px;min-height:72px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.actions a,.actions button{appearance:none;text-decoration:none;text-align:center;border:0;border-radius:9px;padding:9px 7px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;color:#071018;box-shadow:0 2px 8px rgba(0,0,0,.16)}.actions>*:nth-child(odd){background:var(--cyan)}.actions>*:nth-child(even){background:var(--red);color:#fff}
.empty{display:none;text-align:center;padding:50px}.zoom-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.96);padding:24px}.zoom-modal.open{display:flex}.zoom-stage{position:relative;width:min(96vw,1500px);height:min(92vh,950px);display:flex;align-items:center;justify-content:center}.zoom-gameplay{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}.zoom-cover{position:absolute;right:2.5%;top:2.5%;width:min(19vw,240px);max-height:48%;object-fit:contain;border-radius:8px;box-shadow:-14px 18px 32px rgba(0,0,0,.7);transform:perspective(900px) rotateY(-9deg)}.zoom-title{position:absolute;left:20px;bottom:16px;max-width:70%;padding:8px 11px;border-radius:9px;background:rgba(0,0,0,.72);font-weight:800}.zoom-close{position:absolute;right:10px;bottom:10px;border:0;border-radius:999px;width:42px;height:42px;background:#fff;color:#111;font-size:22px;font-weight:900;cursor:pointer}
@media(max-width:700px){body{background:linear-gradient(90deg,var(--cyan) 0 12px,var(--bg) 12px calc(100% - 12px),var(--red) calc(100% - 12px) 100%)}header:before,header:after{width:12px}.wrap,main{padding-left:24px;padding-right:24px}.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap"><h1>Juegos Nintendo Switch</h1><div class="stats" id="stats"></div></div></header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty">No hay juegos en este filtro.</div></main>
<div class="zoom-modal" id="zoomModal"><div class="zoom-stage"><img class="zoom-gameplay" id="zoomGameplay"><img class="zoom-cover" id="zoomCover"><div class="zoom-title" id="zoomTitle"></div><button class="zoom-close" id="zoomClose">×</button></div></div>
<script src="descriptions.js"></script><script src="games-base.js"></script><script src="games-2025.js"></script><script src="games-2024.js"></script><script src="games-2023.js"></script><script src="games-2022.js"></script><script src="games-2021.js"></script><script src="games-2020.js"></script>
<script>
const years=[2025,2024,2023,2022,2021,2020];
const descOverrides=window.DESC_OVERRIDES||{};
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function fallbackDesc(name,year){const n=name.toLowerCase();if(/fifa|nba 2k|mlb|golf|fitness|just dance|wrc|nascar|sports/.test(n))return'Juego deportivo centrado en partidas, progresión y modos inspirados en su disciplina.';if(/racing|kart|hot wheels|need for speed|burnout|ride on the edge|inertial drift/.test(n))return'Juego de carreras con énfasis en velocidad, circuitos, vehículos y competición.';if(/dragon quest|xenoblade|trails|ys |neptunia|atelier|rune factory|disgaea|fairy tail|shin megami|persona|bravely|monster hunter stories/.test(n))return'RPG centrado en explorar, desarrollar personajes y avanzar mediante combates y una historia de aventura.';if(/mortal kombat|samurai shodown|all-star brawl|under night/.test(n))return'Juego de lucha con distintos personajes, técnicas especiales y combates directos.';return`Juego lanzado para Nintendo Switch en ${year}. La ficha intenta cargar automáticamente un resumen en español de Wikipedia.`}
function assets(name){const q=encodeURIComponent('"'+name+'"');return{images:[`https://tse1.mm.bing.net/th?q=${q}+Nintendo+Switch+gameplay+screenshot&w=720&h=405&c=7&rs=1&qlt=90&pid=1.7&mkt=en-US&cc=US&setlang=en`,`https://tse2.mm.bing.net/th?q=${q}+gameplay+Switch&w=720&h=405&c=7&rs=1&qlt=90&pid=1.7&mkt=en-US&cc=US&setlang=en`,`https://tse3.mm.bing.net/th?q=${q}+in+game+screenshot&w=720&h=405&c=7&rs=1&qlt=90&pid=1.7&mkt=en-US&cc=US&setlang=en`],cover:`https://tse4.mm.bing.net/th?q=${q}+Nintendo+Switch+box+art+cover&w=420&h=630&c=7&rs=1&qlt=90&pid=1.7&mkt=en-US&cc=US&setlang=en`,youtube:'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' Nintendo Switch gameplay'),bing:'https://www.bing.com/images/search?q='+encodeURIComponent('"'+name+'" Nintendo Switch gameplay screenshot'),wiki:'https://es.wikipedia.org/wiki/Especial:Buscar?search='+encodeURIComponent(name)}}
const games=(window.BASE_GAMES||[]).map(g=>({...g,filters:[g.group],desc:descOverrides[g.name]||fallbackDesc(g.name,g.group.match(/\d{4}/)?.[0]||''),autoDesc:!descOverrides[g.name],...assets(g.name)})),byName=new Map(games.map(g=>[norm(g.name),g]));
function addYear(rows,year){const group='Lanzamientos '+year;for(const[name,date]of rows||[]){const key=norm(name);if(byName.has(key)){const g=byName.get(key);if(!g.filters.includes(group))g.filters.push(group);if(g.group==='Imprescindibles'&&String(g.release).startsWith('Top #'))g.release=date+' · '+g.release;continue}const g={name,group,filters:[group],release:date,desc:descOverrides[name]||fallbackDesc(name,year),rank:null,autoDesc:!descOverrides[name],...assets(name)};games.push(g);byName.set(key,g)}}years.forEach(y=>addYear(window['GAMES_'+y],y));
const grid=document.getElementById('grid'),stats=document.getElementById('stats'),empty=document.getElementById('empty');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(g,i){return`<article class="card" data-filters="${esc(g.filters.join('|'))}" data-i="${i}"><div class="shot"><img class="gameplay" id="img-${i}" src="${esc(g.images[0])}" loading="lazy" referrerpolicy="no-referrer" onerror="nextImg(${i})"><img class="cover" id="cover-${i}" src="${esc(g.cover)}" loading="lazy" referrerpolicy="no-referrer"><span class="label">${esc(g.group)}</span></div><div class="body"><div class="name">${esc(g.name)}</div><div class="meta">${esc(g.release)} · Nintendo Switch</div><div class="intro" id="desc-${i}">${esc(g.desc)}</div><div class="actions"><button onclick="openZoom(${i})">Zoom</button><a href="${esc(g.youtube)}" target="_blank">YouTube gameplay</a><a href="${esc(g.bing)}" target="_blank">Ver más screenshots</a><a href="${esc(g.wiki)}" target="_blank">Wiki</a></div></div></article>`}grid.innerHTML=games.map(card).join('');
const order=['Lanzamientos 2026',...years.map(y=>'Lanzamientos '+y),'Imprescindibles'],counts={};games.forEach(g=>g.filters.forEach(f=>counts[f]=(counts[f]||0)+1));stats.innerHTML=`<button class="pill active" data-group="">Todos: ${games.length}</button>`+order.filter(k=>counts[k]).map(k=>`<button class="pill" data-group="${esc(k)}">${esc(k)}: ${counts[k]}</button>`).join('');
stats.onclick=e=>{const b=e.target.closest('.pill');if(!b)return;const group=b.dataset.group;document.querySelectorAll('.card').forEach(c=>c.style.display=!group||c.dataset.filters.split('|').includes(group)?'':'none');document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x===b));empty.style.display=[...document.querySelectorAll('.card')].some(c=>c.style.display!=='none')?'none':'block';window.scrollTo({top:0,behavior:'smooth'})};
const pos=new Array(games.length).fill(0);window.nextImg=i=>{pos[i]++;const im=document.getElementById('img-'+i);if(pos[i]<games[i].images.length)im.src=games[i].images[pos[i]];else im.removeAttribute('onerror')};
const modal=document.getElementById('zoomModal');window.openZoom=i=>{document.getElementById('zoomGameplay').src=document.getElementById('img-'+i).src;document.getElementById('zoomCover').src=document.getElementById('cover-'+i).src;document.getElementById('zoomTitle').textContent=games[i].name;modal.classList.add('open')};const close=()=>modal.classList.remove('open');document.getElementById('zoomClose').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};
function trimSummary(t){t=String(t||'').replace(/\s+/g,' ').trim();const s=t.match(/[^.!?]+[.!?]+/g)||[];let o=(s.slice(0,2).join(' ')||t).trim();return o.length>420?o.slice(0,417).replace(/\s+\S*$/,'')+'…':o}
const loaded=new Set();async function wikiDesc(i){const g=games[i];if(!g.autoDesc||loaded.has(i))return;loaded.add(i);try{const p=new URLSearchParams({action:'query',generator:'search',gsrsearch:g.name+' videojuego',gsrlimit:'1',prop:'extracts',exintro:'1',explaintext:'1',redirects:'1',format:'json',origin:'*'}),r=await fetch('https://es.wikipedia.org/w/api.php?'+p);if(!r.ok)return;const d=await r.json(),pages=d?.query?.pages;if(!pages)return;const t=trimSummary(Object.values(pages)[0]?.extract);if(t.length<80)return;document.getElementById('desc-'+i).textContent=t}catch(e){}}const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){wikiDesc(+e.target.dataset.i);obs.unobserve(e.target)}}),{rootMargin:'500px'});document.querySelectorAll('.card').forEach(c=>obs.observe(c));
</script></body></html>

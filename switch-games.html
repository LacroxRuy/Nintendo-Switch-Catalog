const grid=document.getElementById('grid'),stats=document.getElementById('stats'),empty=document.getElementById('empty');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(g,i){return `<article class="card" data-group="${esc(g.group)}"><div class="shot"><img class="gameplay" id="img-${i}" src="${esc(g.images[0])}" loading="lazy" referrerpolicy="no-referrer" onerror="nextImg(${i})"><img class="cover" id="cover-${i}" src="${esc(g.cover)}" loading="lazy" referrerpolicy="no-referrer"><span class="label">${esc(g.group)}</span></div><div class="body"><div class="name">${esc(g.name)}</div><div class="meta">${esc(g.release)} · Nintendo Switch</div><div class="intro">${esc(g.desc)}</div><div class="actions"><button onclick="openZoom(${i})">Zoom</button><a href="${esc(g.youtube)}" target="_blank" rel="noopener">YouTube gameplay</a><a href="${esc(g.bing)}" target="_blank" rel="noopener">Ver más screenshots</a><a href="${esc(g.wiki)}" target="_blank" rel="noopener">Wiki</a></div></div></article>`}
grid.innerHTML=games.map(card).join('');
const counts={};games.forEach(g=>counts[g.group]=(counts[g.group]||0)+1);stats.innerHTML=`<button class="pill active" data-group="">Todos: ${games.length}</button>`+Object.entries(counts).map(([k,v])=>`<button class="pill" data-group="${esc(k)}">${esc(k)}: ${v}</button>`).join('');
stats.addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;const group=b.dataset.group;document.querySelectorAll('.card').forEach(c=>c.style.display=!group||c.dataset.group===group?'':'none');document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x===b));empty.style.display=[...document.querySelectorAll('.card')].some(c=>c.style.display!=='none')?'none':'block';window.scrollTo({top:0,behavior:'smooth'})});
const pos=new Array(games.length).fill(0);window.nextImg=i=>{pos[i]++;const im=document.getElementById('img-'+i);if(pos[i]<games[i].images.length)im.src=games[i].images[pos[i]];else im.removeAttribute('onerror')};
const zoomModal=document.getElementById('zoomModal'),zoomGameplay=document.getElementById('zoomGameplay'),zoomCover=document.getElementById('zoomCover'),zoomTitle=document.getElementById('zoomTitle');window.openZoom=i=>{zoomGameplay.src=document.getElementById('img-'+i).src;zoomCover.src=document.getElementById('cover-'+i).src;zoomTitle.textContent=games[i].name;zoomModal.classList.add('open')};function closeZoom(){zoomModal.classList.remove('open')}document.getElementById('zoomClose').onclick=closeZoom;zoomModal.addEventListener('click',e=>{if(e.target===zoomModal)closeZoom()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom()});
</script></body></html>
